<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <!-- Definitions for gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E001C" />
      <stop offset="100%" stop-color="#5F0010" />
    </linearGradient>
    <pattern id="langkitWeave" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <path d="M 0,10 L 10,0 L 20,10 L 10,20 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <rect x="8" y="8" width="4" height="4" fill="#9E001C"/>
    </pattern>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Traditional Geometric Weave Tower (Left) -->
    <g transform="translate(10, 0)">
      <!-- Base platform -->
      <rect x="5" y="125" width="40" height="8" rx="2" fill="url(#goldGrad)" />
      <!-- Tower body - stacked geometric patterns -->
      <rect x="10" y="20" width="30" height="100" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="2" rx="2"/>
      
      <!-- Inside geometric symbols -->
      <!-- Top diamond -->
      <polygon points="25,25 35,35 25,45 15,35" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
      <rect x="23" y="33" width="4" height="4" fill="url(#goldGrad)"/>
      
      <!-- Middle divider -->
      <line x1="10" y1="52" x2="40" y2="52" stroke="url(#goldGrad)" stroke-width="2"/>
      <line x1="10" y1="58" x2="40" y2="58" stroke="url(#goldGrad)" stroke-width="2"/>
      
      <!-- Hourglass patterns -->
      <polygon points="15,65 35,65 25,75" fill="url(#goldGrad)"/>
      <polygon points="15,85 35,85 25,75" fill="url(#goldGrad)"/>
      
      <!-- Bottom divider -->
      <line x1="10" y1="92" x2="40" y2="92" stroke="url(#goldGrad)" stroke-width="2"/>
      
      <!-- Bottom diamond -->
      <polygon points="25,98 33,106 25,114 17,106" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      
      <!-- Crown top structure -->
      <path d="M 12,20 L 20,5 L 25,12 L 30,5 L 38,20 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Typography -->
    <!-- "Langkit" Wordmark -->
    <text x="80" y="82" font-family="'Outfit', 'Inter', 'Georgia', serif" font-weight="800" font-size="76" fill="url(#goldGrad)" letter-spacing="1">Langkit</text>
    
    <!-- "UNIVERSITY SHOP" Subtitle -->
    <text x="82" y="120" font-family="'Outfit', 'Inter', 'Arial', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" letter-spacing="3.5">UNIVERSITY SHOP</text>
    
    <!-- Subtle accent line -->
    <line x1="82" y1="130" x2="480" y2="130" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Accent dots -->
    <circle cx="495" cy="130" r="3" fill="url(#goldGrad)"/>
    <circle cx="510" cy="130" r="4.5" fill="url(#goldGrad)"/>
    <circle cx="530" cy="130" r="6" fill="url(#goldGrad)"/>
  </g>
</svg>
